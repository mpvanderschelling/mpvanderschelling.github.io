# Site settings
title: "Martin van der Schelling"
description: "Resume of Martin van der Schelling"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Repo tooling, not site content. Without this, Jekyll renders these as pages and
# runs Liquid over them -- a stray Liquid tag in a note file then breaks the whole build.
# NOTE: setting `exclude` REPLACES Jekyll's default list rather than adding to it,
# so the defaults (plus CNAME) are restated here.
exclude:
  - .jekyll-cache/
  - .sass-cache/
  - CNAME
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - CLAUDE.md

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Martin van der Schelling"
resume_title:                   "PhD Candidate in Materials Science & Engineering"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "martin@vanderschelling.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         ""

resume_header_contact_info:     "martin@vanderschelling.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>	<b>Hi!</b> I'm interested in developing <b>research software</b> for a better world, combining <b>computational modeling</b> and optimization with <b>materials science</b>. With my chemical background, I'm curious about the world of <b>plastics and composites</b>, and I'm ready to take on the challenges that come with the clean energy transition. Besides, I play the piano in a cover band! </p>"



# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        false
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           false
resume_section_associations:    true
resume_section_interests:       false

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/mpvanderschelling"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "https://www.facebook.com/martin.vanderschelling"
  resume_linkedin_url:          "https://www.linkedin.com/in/mpvanderschelling/"
  # resume_instagram_url:         "insert your Instagram URL here"
  # resume_website_url:           "https://mpvanderschelling.github.io/feestboek/"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

