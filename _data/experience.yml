    design of experiments, simulation, machine learning and optimization, with MPI-parallel data
    generation on HPC clusters.</li>
    <li><b>Learning to Choose Optimizers:</b> Developing L2CO, a meta-learned optimizer-selection
    framework that matches or outperforms the single best optimizer on standard black-box benchmarks
    and was accepted at IEEE CEC 2026, by training a model that picks an optimizer from problem
    features alone and reassesses that choice during the run. Now extending L2CO to
    reinforcement-learning policies that switch optimizers multiple times within a single run.</li>
    </ul>
  collapsed_text: >-
    Optimization plays a central role in data-driven design. However, choosing an appropriate
    optimization algorithm for a specific task is often challenging, as it depends on the structure of
    the optimization problem and practical limitations such as the computational budget. To tackle this
    challenge, the field has seen a shift from manually designing optimizers toward using machine
    learning methods that attempt to learn the optimization process itself. Despite significant
    progress, existing approaches frequently exhibit limited generalization to new distributions and
    typically require retraining to transfer their knowledge.<br><br>
    We introduce a new approach called "Learning to Choose Optimizers" (L2CO). In our approach, a
    meta-learner first selects an optimizer before any function evaluations&mdash;based solely on
    available problem characteristics&mdash;and then reassesses that choice using a unified model that
    jointly encodes problem context, optimizer identity, and the observed optimization trajectory. By
    restricting selection to well-established algorithms, L2CO avoids the convergence issues of learned
    update rules while retaining the adaptability of dynamic selection.<br><br>
    In this work, we train our model offline on a collection of benchmark functions, employing a mixture
    of gradient-based, population-based, and probabilistic model-based optimizers. We demonstrate the
    effectiveness of our method by comparing its performance to classical optimizers on standard
    benchmark problems and a neural net classification task. The empirical results indicate that L2CO is
    a promising tool with improved generalization capabilities.
    <figure>
     <img src="images/l2co-overview.png" alt="Overview of the L2CO framework" class="centeringfull" itemprop="image">
     <figcaption class="figcaption">Overview of the L2CO framework. A first decision selects an initial optimizer from the problem features alone; a second, trajectory-aware decision then fuses problem embeddings, optimizer embeddings and the observed trajectory to either confirm that choice or warm-start a switch to a more suitable optimizer.</figcaption>
    </figure>
    <br>
    van der Schelling, M., Toshniwal, D., &amp; Bessa, M. A. <i>Learning to Choose Optimizers</i>.
    IEEE Congress on Evolutionary Computation (CEC), 2026.
  collapses:
    - collapse_name: f3dasm &mdash; a Framework for Data-Driven Design and Analysis of Structures and Materials
      collapsed_text: >-
        Recent advances in computational resources have accelerated the development of inverse design
        approaches for structures and materials. In particular, data-driven strategies that leverage
        machine learning are increasingly shaping modern design workflows. However, constructing and
        maintaining large material-response databases remains challenging in practice. Typical challenges
        include data management, efficient parallel computing, and the integration of third-party
        simulation or analysis software. Because many applied fields remain conservative in openly
        sharing data and software, researchers often spend substantial time re-implementing standard
        procedures, hindering reproducibility, benchmarking, and adherence to FAIR principles.<br><br>
        In this work, we introduce <a href="https://github.com/bessagroup/f3dasm"><b>f3dasm</b></a>
        (framework for data-driven design &amp; analysis of structures and materials), a general and
        user-friendly open-source package that supports the full data-driven design pipeline. The
        framework aims to streamline research workflows, facilitate the replication of existing studies,
        and encourage the sharing of new experiments and results. <b>f3dasm</b> emphasizes flexibility,
        interoperability, and modularity. In particular, it enables researchers to integrate different
        software packages and computational tools across the key stages of a data-driven design loop:
        (1) design of experiments; (2) data generation; (3) machine learning and surrogate modeling;
        and (4) optimization.<br><br>
        Since its first public release, <b>f3dasm</b> has been expanded to support MPI-based
        parallelization in high-performance clusters, enabling efficient large-scale data generation and
        simulation workloads. Furthermore, <b>f3dasm</b> adopts array-centric data structures that avoid
        breaking the computational graph when interfacing with automatic differentiation libraries,
        facilitating gradient-based learning and optimization. By lowering technical barriers and
        promoting reproducibility, <b>f3dasm</b> contributes to democratizing data-driven design for
        researchers and practitioners in structural and material engineering.
        <figure>
         <img src="images/f3dasm-data-driven-process.png" alt="The data-driven design process supported by f3dasm" class="centeringfull" itemprop="image">
         <figcaption class="figcaption">The four stages of the data-driven design process covered by f3dasm: design of experiments, data generation, machine learning, and optimization.</figcaption>
        </figure>
        <br>
        van der Schelling et al., (2024). <i>f3dasm: Framework for Data-Driven Design and Analysis of
        Structures and Materials</i>. Journal of Open Source Software, 9(100), 6912,
        <a href="https://doi.org/10.21105/joss.06912">https://doi.org/10.21105/joss.06912</a>

