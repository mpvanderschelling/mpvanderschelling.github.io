- degree: External Research Project
  uni: Imperial College London
  year: Sept, 2019 &mdash; Dec, 2019
  collapse: True
  collapse_name: Simulating the charge mobility of C<sub>16</sub>-IDTBT
  awards:
    - award: >-
        <b>Research:</b> Simulated hole mobility in the conjugated polymer C<sub>16</sub>-IDTBT,
        reproducing the trend of experimental transient SCLC measurements, by writing a Python pipeline
        that maps molecular-dynamics morphologies onto the Kinetic Monte Carlo code ToFeT; graded
        <b>9.0/10</b>.
    - award: >-
        <b>Publication:</b> Co-authored the <b>PNAS</b> paper
        <a href="https://www.pnas.org/doi/abs/10.1073/pnas.2403879121">'Perpendicular crossing chains
        enable high mobility in a noncrystalline conjugated polymer'</a> (2024), by contributing the
        kinetic Monte Carlo charge-transport simulations of C<sub>16</sub>-IDTBT.

  collapsed_text: <i>To enhance the performance of <b>organic solar cells</b>, it is essential to investigate the microscopic features that affect the charge mobility in semiconducting materials. The co-polymer indacenodithiophene-benzothiadiazole (C<sub>16</sub>-IDTBT) has shown promising results for high mobility hole transfer. This research attempts to integrate the <b>microscopic dynamics</b> of this co-polymer onto the <b>macroscopic simulation program ToFeT</b>. The Time-of-Flight and field-effect transistor mobility measurement methods and their implementation in the simulation code are described. Subsequently, a <b>network of inter- and intramolecular interactions</b> is built, and the morphology of C<sub>16</sub>-IDTBT is extracted from a molecular dynamics simulation in Gromacs. The resulting hole mobilities are compared with transient SCLC and FET experimental data from the literature. The time-of-flight mobilities show similar behavior to experimental transient SCLC mobilities.</i><br> 
  

  
   <figure>
    <img src="images/snapshotidtbt.png" alt="Snapshot of C16-IDTBT" class="centering" itemprop="image">
    <figcaption class="figcaption">Molecular structure of C<sub>16</sub>-IDTBT.</figcaption>
   </figure>
   
   From this three-month internship, I have learned to work in an interdisciplinary team. With limited prior knowledge of C, I managed to understand and use a complicated Kinetic Monte Carlo program and adapt it to my own research. Furthermore, I worked with <b>Python, bash and a cluster computer network</b>.<br>
   
   <figure>
    <img src="images/flowchart.png" alt="Flowchart of the research project" width=100% itemprop="image">
    <figcaption class="figcaption">Flowchart of the external research project.</figcaption>
   </figure>
   
   This research was part of the EU-funded project <a href="https://cordis.europa.eu/project/id/742708">CAPaCITy</a>.
   <br><br>
   This work contributed to the following peer-reviewed publication:<br>
   <ul class="resume-item-list"><li>J. F. Coker, S. Moro, A. S. Gertsen, X. Shi, D. Pearce, <b>M. P. van der Schelling</b>, Y. Xu, W. Zhang, J. W. Andreasen, C. R. Snyder, L. J. Richter, M. J. Bird, I. McCulloch, G. Costantini, J. M. Frost and J. Nelson, <a href="https://www.pnas.org/doi/abs/10.1073/pnas.2403879121">'Perpendicular crossing chains enable high mobility in a noncrystalline conjugated polymer'</a>, <i>Proceedings of the National Academy of Sciences</i> <b>121</b>(37), e2403879121 (2024).</li></ul>
   
- degree: BSc Molecular Science & Technology
  uni: Delft University of Technology
  year: Sept, 2013 &mdash; Mar, 2018
  collapse: True
  collapse_name: Study of UiO-66 linkers' rotational dynamics
  awards:
    - award: >-
        <b>BSc thesis:</b> Characterized the linker rotational dynamics of UiO-66 metal-organic
        frameworks for molecular data storage, showing that UiO-66-NO<sub>2</sub> matches the
        linker&ndash;framework interaction of MIL-53-NO<sub>2</sub>, by synthesizing and
        characterizing the frameworks (PXRD, DRIFTS, TGA, N<sub>2</sub> adsorption) and measuring
        them with broadband dielectric spectroscopy.
    - award: Minor in Sustainable Energy &amp; Technology.
   # - award: Major &mdash; Chemical Technology

  collapsed_text: <i>Due to the ever-increasing demand for efficient data storage, innovative ways of <b>storing data on the molecular level</b> are being investigated. To store data on the molecular level, rotating linkers of the <b>UiO-66 metal-organic framework</b> (MOF) are possible candidates. Before we can control this rotation, the <b>rotational dynamics</b> of the 1,4-dicarboxylic linker are being researched. With the characterization techniques PXRD, DRIFTS, TGA and N<sub>2</sub>-adsorption, it was concluded that the structure and surface area are the same as those of reported materials. With broadband dielectric spectroscopy, the rotational dynamics of the metal-organic frameworks were examined. In addition, we compared UiO-66-NO<sub>2</sub> with another MOF with the same BDC linker, MIL-53-NO<sub>2</sub>, and it showed that the dielectric relaxation is around the same temperature. This suggests that the interaction of the linker and the framework is of equal magnitude. In conclusion, UiO-66-NO<sub>2</sub> has a similar interframework interaction to MIL-53-NO<sub>2</sub>. The large difference between relaxation temperatures for UiO-66-NH<sub>2</sub> and UiO-66-NO<sub>2</sub> may be explained by the <b>interactions between the cornerstone and the linker</b> which can hinder the rotation.</i><br>
  
   <figure>
    <img src="images/bds_uio66nh2.png" alt="Broadband dielectric spectroscopy of UiO-66-NH2" class="centering" itemprop="image">
    <figcaption class="figcaption">Low-frequency broadband dielectric spectroscopy of UiO-66-NH<sub>2</sub>.</figcaption>
   </figure>
  
   During my bachelor's thesis, I have gained <b>hands-on experience in a chemical lab</b> and can therefore work independently, safely and efficiently.